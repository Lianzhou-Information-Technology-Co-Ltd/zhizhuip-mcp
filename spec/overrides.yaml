# 路径 → 工具名、中文描述、标注、产品列表、拆分与参数修正。人工维护。
# 产品参数（type/status/native/version/is_month）不用在这里写，生成器按分组换成 product 枚举。
# "文档缺陷兜底" 条目在文档站修好后删除。
ignore:
  - /externalapi/tool/deleteSubAccountWhiteList # 清空子账号白名单，本期不暴露

derived: # 从已有工具派生、只取响应 data 里一个字段
  - name: user_balance
    from: /externalapi/user/getGetUserInfo
    pick: money
    title: 账户余额
    description: 查询当前账号余额，data 直接是金额字符串，单位元。充值余额与赠送余额的拆分看 user_info。

tools:
  # ===== 只读工具（--readonly 只暴露这些）=====
  /externalapi/user/getGetUserInfo:
    name: user_info
    title: 账号信息
    description: 查询当前账号的基本信息与余额：money 总余额、origin_money 充值余额、give_money 赠送余额。
    readOnly: true
  /externalapi/tool/getUserCustomPriceInfo:
    name: user_price
    title: 用户价格
    description: 查询当前账号各产品的实际价格，含管理员给该账号设置的自定义价；下单前用它估算费用。
    readOnly: true
  /externalapi/tool/getOriginCustomPriceInfo:
    name: official_price
    title: 官网价格
    description: 查询各产品的官网标价。后端缓存 5 分钟。
    readOnly: true
  /externalapi/conpons/conponList:
    name: coupon_list
    title: 优惠券列表
    description: 查询当前账号可用的优惠券，下单或续费时把返回的 id 填到 conpon_id。这个接口按套餐类型与计费模式筛选，不用 product。
    readOnly: true
    params:
      type: { enum: [0, 1, 2], description: 套餐类型：0=动态住宅，1=静态住宅，2=数据中心 }
      status: { enum: [0, 1], description: 计费模式：0=按流量（动态住宅），1=按时长（静态住宅与数据中心固定填 1） }
  /externalapi/common/countryList:
    name: country_list
    title: 国家列表
    description: 查询某产品可选的国家及编码。
    readOnly: true
  /externalapi/common/stateList:
    name: state_list
    title: 州/省列表
    description: 查询动态住宅产品某国家下可选的州或省。
    readOnly: true
    params:
      country_id: { description: 国家 id，取 country_list 返回的 id }
      country_code: { description: 国家编码，取 country_list 返回的编码；和 country_id 二选一 }
  /externalapi/common/cityList:
    name: city_list
    title: 城市列表
    description: 查询某产品某国家下可选的城市；动态住宅产品还要指定州或省。
    readOnly: true
    params:
      country_id: { description: 国家 id，取 country_list 返回的 id }
      state_id: { description: 州或省 id，取 state_list 返回的 id }
      state_code: { description: 州或省编码，取 state_list 返回的编码；和 state_id 二选一 }
      country_code: { description: 国家编码，取 country_list 返回的编码；和 country_id 二选一 }
  /externalapi/device/providerList:
    name: provider_list
    title: 可用供应商列表
    description: 查询动态住宅产品可用的供应商（资源池），返回的 id 可作为新增子账号或查询流量时的 spec。
    readOnly: true
  /externalapi/device/accountList:
    name: sub_account_list
    title: 子账号列表
    description: 分页查询某产品的子账号，返回子账号 id、账号密码、端口、国家、到期时间等；后面所有按子账号操作的工具都从这里取 id。
    readOnly: true
    params:
      subAccounts: { description: 子账号 id 集合，多个以英文逗号连接（动态产品用） }
      ids: { description: 子账号 id 集合，多个以英文逗号连接（时长类产品用） }
      remark: { description: 按备注模糊搜索（动态产品用） }
      countryList: { description: 国家编码，多个以英文逗号分隔（动态产品用） }
      customUsername: { description: 按自定义账号搜索（时长类产品用） }
      search_type: { enum: [0, 1, 2], description: 搜索类型：0=自定义账密，1=子账号 IP，2=备注；搜索值放 searchArr（时长类产品用） }
      searchArr: { description: 搜索值列表，与 search_type 配合（时长类产品用） }
  /externalapi/device/userSetMeal:
    name: flow_package_list
    title: 已购流量套餐记录
    description: 分页查询动态住宅产品已购买的流量套餐记录。
    readOnly: true
  /externalapi/device/userListEnabled:
    name: main_account_switch_token
    title: 主账号切换 token
    description: 获取动态住宅主账号的切换 token，用于 api 子账号切换时的独立 token 验证；后端还没有时会生成一个。
    readOnly: true
  /externalapi/total/subAccountFlow:
    name: sub_account_flow
    title: 子账号流量
    description: 查询动态住宅某个子账号在日期区间内每天的流量。区间最多 30 天，结束日期不能晚于今天。
    readOnly: true
    params:
      start_date: { description: 开始日期，格式 YYYY-MM-DD }
      end_date: { description: 结束日期，格式 YYYY-MM-DD，不早于开始日期、不晚于今天 }
      spec: { description: 供应商 id，取 provider_list 返回的 id；不传查全部 }
  /externalapi/total/userFlowTotal:
    name: main_account_flow
    title: 主账号流量
    description: 查询动态住宅主账号的流量汇总。
    readOnly: true
  /externalapi/tool/accountLimitFlowDetail:
    name: sub_account_limit_flow
    title: 子账号流量上限配置
    description: 查询动态住宅某个子账号的流量上限设置与已用量。
    readOnly: true
  /externalapi/tool/accountLimitFlowBatchDetail:
    name: sub_account_limit_flow_batch
    title: 批量子账号流量上限配置
    description: 分页查询多个动态住宅子账号的流量上限设置。
    readOnly: true
    params: # 文档缺陷兜底：accounts 写成 integer，实为多个 id
      accounts: { description: 子账号 id 集合，多个以英文逗号连接 }
  /externalapi/tool/getSubAccountWhiteList:
    name: sub_account_whitelist
    title: 子账号白名单
    description: 读取动态住宅某个子账号的 IP 白名单。
    readOnly: true
    products: [dynamic-no-expiry, dynamic-monthly] # 文档缺陷兜底：页面挂在永久分组却固定 is_month=1，后端两种动态产品都接受
    params:
      id: { required: true, description: 子账号 id }
  /externalapi/bandwidth/getBandwidthList:
    name: bandwidth_package_list
    title: 带宽套餐列表
    description: 查询某静态住宅产品在某国家可选的带宽套餐及价格；下单或升级时把返回的带宽值填到 bandwidth_num。
    readOnly: true
  /externalapi/bandwidth/bandwidthNumDetail:
    name: bandwidth_detail
    title: 有效期内带宽详情
    description: 查询子账号剩余有效期内已购带宽的详情。后端缓存 120 秒，不要频繁调用。
    readOnly: true
  /externalapi/bandwidth/monitoringTrend:
    name: bandwidth_trend
    title: 子账号带宽趋势
    description: 查询子账号的带宽变化趋势：trend_type=1 取最近的实时数据，trend_type=2 按 startTime、endTime 取历史，跨度不超过 31 天。
    readOnly: true
    params:
      trend_type: { enum: [1, 2], description: 趋势类型：1=实时，2=历史（要传 startTime、endTime） }
      startTime: { description: 开始时间戳（秒），trend_type=2 时必填 }
      endTime: { description: 结束时间戳（秒），trend_type=2 时必填 }
  /externalapi/inventory_status/ipStrStatus:
    name: ip_range_status
    title: IP 段库存状态
    description: 分页查询某静态住宅产品的 IP 段及库存状态；下单时可把有库存的段填到 ip_str 或 specifyIps。
    readOnly: true
    params: # 文档缺陷兜底：全部参数写成 string；分页参数后端就叫 pageSize
      page: { type: integer, description: 页码，默认 1 }
      pageSize: { type: integer, description: 每页条数，默认 50，最大 100 }
      ip_str: { description: IP 段前缀，1 到 3 段，如 104 或 104.223 }
      exclude_ip_str: { description: 要排除的 IP 段前缀，多个以英文逗号分隔 }
      country_code: { description: 国家编码，取 country_list 返回的编码 }
      city_code: { description: 城市名称，取 city_list 返回的名称 }

  # ===== 写操作工具（默认模式才有，执行前先向用户确认）=====
  /externalapi/device/accountAdd:
    name: sub_account_add
    title: 新增动态子账号
    description: 为动态住宅产品新增 num 个子账号，消耗主账号已购流量，不额外扣费。返回新建子账号的账号密码。
    params:
      changeInterval: { description: IP 切换间隔，单位分钟，5 到 120 }
      agree: { enum: [SOCKS5, HTTP, HTTPS], description: 协议 }
      country: { description: "国家编码（ISO 3166-1 二字码），多个以英文逗号分隔，如 US,JP；可选国家用 country_list 查" } # 流式映射里的英文逗号要加引号，否则会被切成两个键
      spec: { description: 指定供应商（资源池）id，取 provider_list 返回的 id }
      use_random_username: { enum: [0, 1], description: 是否使用随机账号密码：0=否，1=是 }
  /externalapi/device/accountUpdate:
    name: sub_account_update
    title: 修改子账号备注
    description: 修改动态住宅某个子账号的备注。
  /externalapi/device/accountUpdateList:
    name: sub_account_update_batch
    title: 批量修改子账号
    description: 批量修改多个动态住宅子账号的备注或 IP 切换间隔，ids 为英文逗号连接的子账号 id。
    params:
      changeInterval: { description: IP 切换间隔，单位分钟，1 到 120 }
  /externalapi/device/batchUpdateSubAccountUsernamePassword:
    name: sub_account_set_credentials
    title: 自定义子账号账密
    description: 为子账号设置自定义用户名和密码，一次可传多个；覆盖 content 里每个子账号的账号与密码。
    params:
      content: { description: 要修改的子账号列表，每项写子账号 id、自定义用户名、自定义密码 }
  /externalapi/device/batchUpdateSubAccountPassword:
    name: sub_account_set_password_batch
    title: 批量改子账号密码
    description: 批量修改时长类子账号的密码，只改密码不改用户名；密码只能是字母和数字，长度 8 到 30。
    params:
      content: { description: 要修改的子账号列表，每项写子账号 id 与新密码 }
  /externalapi/device/portEnableUpdateList:
    name: sub_account_toggle_port
    title: 批量开关端口连接
    description: 批量开启或关闭静态住宅子账号的 IP 端口连接状态。
    params:
      use_ip_port: { enum: [0, 1], description: 开关状态：0=关闭，1=开启 }
  /externalapi/tool/accountLimitFlowSet:
    name: sub_account_set_limit_flow
    title: 设置子账号流量上限
    description: 设置动态住宅某个子账号在一个周期内的流量上限，达到上限断开连接，下个周期恢复；同一个子账号只允许设置一个周期。
    params:
      cycle: { enum: ['0', '1', '2', '3', '4'], description: 限制周期：0=每天，1=每周，2=每月，3=每季度，4=每年 }
      limit_flow: { description: 上限流量，单位 GB }
  /externalapi/tool/accountLimitFlowBatchSet:
    name: sub_account_set_limit_flow_batch
    title: 批量设置子账号流量上限
    description: 批量设置多个动态住宅子账号在同一周期内各自的流量上限；同一个子账号只允许设置一个周期。
    params:
      cycle: { enum: ['0', '1', '2', '3', '4'], description: 限制周期：0=每天，1=每周，2=每月，3=每季度，4=每年 }
      accounts: { description: 子账号配置列表，每项写子账号 id（account）和上限流量 GB（limit_flow） }
      "accounts[0][account]": { description: 子账号 id }
      "accounts[0][limit_flow]": { description: 上限流量，单位 GB }
  /externalapi/tool/setSubAccountWhiteList:
    name: sub_account_set_whitelist
    title: 设置子账号白名单
    description: 设置动态住宅某个子账号的 IP 白名单，整体覆盖原有列表。
    products: [dynamic-no-expiry, dynamic-monthly] # 文档缺陷兜底：同 sub_account_whitelist
    params:
      id: { required: true, description: 子账号 id }
      ip_list: { required: true, description: 白名单 IP 列表，多个以英文逗号分隔 }
  /externalapi/device/accountDelete:
    name: sub_account_delete
    title: 删除子账号
    description: 不可恢复。删除动态住宅的一个子账号。
    destructive: true
    params: # 文档缺陷兜底：id 标为可选，后端必填
      id: { required: true, description: 子账号 id }
  /externalapi/device/accountDeleteList:
    name: sub_account_delete_batch
    title: 批量删除子账号
    description: 不可恢复。批量删除动态住宅的多个子账号，ids 为英文逗号连接的子账号 id。
    destructive: true
  /externalapi/product_order/createProductOrder:
    split:
      - name: order_buy_dynamic
        title: 购买动态住宅流量
        description: 会从账户余额扣费。购买动态住宅流量，num 为 GB 数；永久套餐流量不过期，期限套餐要用 bill_timelen 指定有效时长。
        destructive: true
        products: [dynamic-no-expiry, dynamic-monthly]
        params:
          bill_timelen: { enum: [1, 2, 3], description: 流量有效时长，只有 dynamic-monthly 需要：1=30天，2=90天，3=180天 }
          conpon_id: { description: 优惠券 id，用 coupon_list 查 }
      - name: order_buy_time_ip
        title: 购买时长 IP
        description: 会从账户余额扣费。购买静态住宅或数据中心的时长 IP 子账号，num 为 IP 数量。后端限制：num 1 到 3000，数据中心单笔不超过 50 个且不支持 7 天档；agree 不传默认 SOCKS5，country 不传默认 US；5 秒内相同参数的重复请求会被拒。
        destructive: true
        products: [static-standard, static-native, static-isp-native, datacenter]
        params:
          timelen: { enum: [0, 1, 2, 3, 4], description: 购买时长：0=7天，1=30天，2=90天，3=180天，4=360天 }
          agree: { enum: [SOCKS5, HTTP, HTTPS], description: 协议 }
          country: { description: 国家编码，用 country_list 查该产品可买的国家 } # 各产品页各写一套说明，合并后只留通用的
          city: { description: 城市名称，取 city_list 返回的名称；不传随机 }
          conpon_id: { description: 优惠券 id，用 coupon_list 查 }
          specifyIps: { description: 指定从哪些 IP 段购买，每项写一个 IP 段前缀和该段要买的数量；IP 段用 ip_range_status 查 }
          "specifyIps[0][ipStr]": { description: IP 段前缀，取 ip_range_status 返回的段 }
          "specifyIps[0][count]": { type: integer, description: 该段要买的数量 }
          bandwidth_num: { description: 购买时选定的增值带宽，可选值和价格用 bandwidth_package_list 查；数据中心没有带宽加购，不要传 }
          use_ip_port: { enum: [0, 1], description: IP 端口连接状态：0=关闭，1=开启 }
          use_random_username: { enum: [0, 1], description: 是否使用随机账号密码：0=否，1=是 }
  /externalapi/product_order/createIpv6Order:
    name: order_buy_ipv6
    title: 购买 IPv6 时长 IP
    description: 会从账户余额扣费。购买静态住宅 IPv6 时长 IP 子账号，num 为 IP 数量。
    destructive: true
    params:
      timelen: { enum: [0, 1, 2, 3, 4], description: 购买时长：0=7天，1=30天，2=90天，3=180天，4=360天 }
      agree: { enum: [SOCKS5, HTTP, HTTPS], description: 协议 }
      city: { description: 城市名称，取 city_list 返回的名称；不传随机 }
      conpon_id: { type: integer, description: 优惠券 id，用 coupon_list 查 } # 文档缺陷兜底：IPv6 购买页把 conpon_id 写成 string，其它下单接口都是 integer
      ip_str: { description: 指定的 IPv6 段 }
      bandwidth_num: { description: 购买时选定的增值带宽 }
      remark: { description: 备注 }
  /externalapi/product_order/createTestOrder:
    name: order_buy_test_ip
    title: 购买测试 IP
    description: 会消耗账号的测试额度。购买静态住宅或数据中心的时长测试 IP，有效期默认 1 天，只用于业务测试。
    destructive: true
    params:
      agree: { enum: [SOCKS5, HTTP, HTTPS], description: 协议 }
      country: { description: 国家编码，用 country_list 查该产品可买的国家 }
      city: { description: 城市名称，取 city_list 返回的名称；不传随机 }
      use_random_username: { enum: [0, 1], description: 是否使用随机账号密码：0=否，1=是 }
  /externalapi/set_meal/renewOrder:
    name: order_renew
    title: 续费时长 IP
    description: 会从账户余额扣费。续费静态住宅或数据中心的时长 IP 子账号，content 按国家分组，每组写子账号 id 列表、国家、续费时长；一次最多 200 个子账号。
    destructive: true
    params:
      content: { description: 续费内容，按国家分组，每组写 ids、country、timelen，可选 renew_with_bandwidth }
      "content[0][ids]": { description: 该组要续费的子账号 id 列表 }
      "content[0][country]": { description: 这组子账号的国家编码，取 sub_account_list 返回的 country }
      "content[0][timelen]": { enum: [0, 1, 2, 3, 4], description: 续费时长：0=7天，1=30天，2=90天，3=180天，4=360天 }
      "content[0][renew_with_bandwidth]": { enum: [0, 1], description: 是否连同带宽一起续费：0=只续子账号，1=子账号和带宽一起续 }
      conpon_id: { description: 优惠券 id，用 coupon_list 查 }
  /externalapi/set_meal/renewOrderIpv6:
    name: order_renew_ipv6
    title: 续费 IPv6 时长 IP
    description: 会从账户余额扣费。续费静态住宅 IPv6 时长 IP 子账号，content 按国家分组，每组写子账号 id 列表、国家、续费时长。
    destructive: true
    params:
      content: { description: 续费内容，按国家分组，每组写 ids、country、timelen }
      "content[0][ids]": { description: 该组要续费的子账号 id 列表 }
      "content[0][country]": { description: 这组子账号的国家编码，取 sub_account_list 返回的 country }
      "content[0][timelen]": { enum: [0, 1, 2, 3, 4], description: 续费时长：0=7天，1=30天，2=90天，3=180天，4=360天 }
      conpon_id: { description: 优惠券 id，用 coupon_list 查 }
  /externalapi/product_order/bandwidthUpgradeOrder:
    name: order_bandwidth_upgrade
    title: 子账号带宽升级
    description: 会从账户余额扣费。把静态住宅子账号的带宽升级到 bandwidth_num；可选档位和价格用 bandwidth_package_list 查。
    destructive: true
    params:
      sub_accounts: { description: 要升级的子账号 id 列表 }
      bandwidth_num: { description: 升级后的带宽值，填 bandwidth_package_list 返回的档位 }
  /externalapi/product_order/createOrderBack:
    name: order_refund_apply
    title: 申请退单
    description: 为静态住宅的一个子账号申请退单，提交后由人工审核，不会立即退款。
    params: # 文档缺陷兜底：remark 写成 integer
      remark: { type: string, description: 退单原因 }
      id: { description: 子账号 id }
  /externalapi/product_order/bookingIPArea:
    name: ip_booking
    title: 预约 IP
